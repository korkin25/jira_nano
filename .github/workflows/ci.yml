# CI for jira_nano.
#
# Quality/security gates + artifact publishing to GHCR:
#   lint-test  — ruff, mypy, pytest (3.11 & 3.12)
#   quality    — radon/xenon code-quality assessment (complexity + maintainability)
#   security   — bandit, pip-audit, semgrep (SAST)
#   iac-scan   — checkov, hadolint, trivy (config/fs misconfig)
#   image      — build the Docker image, trivy-scan it, push to GHCR (main + tags)
#   chart      — helm lint/template, package + push the OCI chart to GHCR (tags)
#   build      — Python sdist/wheel on a version tag
#
# Newly-added scanners run in report mode (soft-fail / continue-on-error) so they
# surface findings without blocking; tighten them to hard gates once the baseline
# is clean.
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/jira-nano
  CHART_REPO: oci://ghcr.io/${{ github.repository_owner }}/charts

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Mypy (type-check)
        run: mypy
      - name: Pytest
        run: pytest -q

  quality:
    name: Code quality (radon/xenon)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install radon/xenon
        run: pip install radon xenon
      - name: Cyclomatic complexity + maintainability index (report)
        run: |
          radon cc -s -a src
          radon mi -s src
      - name: Complexity gate (xenon)
        continue-on-error: true
        run: xenon --max-absolute C --max-modules B --max-average A src

  security:
    name: Security (bandit/pip-audit/semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install bandit pip-audit semgrep
      - name: Bandit
        run: bandit -c pyproject.toml -r src
      - name: pip-audit
        run: pip-audit
      - name: Semgrep (SAST)
        continue-on-error: true
        run: semgrep scan --config p/python --config p/security-audit --error --skip-unknown-extensions

  iac-scan:
    name: IaC scan (checkov/hadolint/trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint (Dockerfile)
        uses: hadolint/hadolint-action@v3.1.0
        continue-on-error: true
        with:
          dockerfile: Dockerfile
      - name: Checkov (Dockerfile/Helm/compose/actions)
        continue-on-error: true
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: dockerfile,helm,kubernetes,github_actions
          soft_fail: true
      - name: Trivy (config misconfig)
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: .
          exit-code: "0"

  image:
    name: Docker image → GHCR
    runs-on: ubuntu-latest
    needs: [lint-test]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image metadata (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build (load locally)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Trivy (image vulnerabilities, report)
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}
          exit-code: "0"
          ignore-unfixed: true
      # Push only on main and version tags.
      - name: Push to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
          while read -r t; do [ -n "$t" ] && docker push "$t"; done <<< "${{ steps.meta.outputs.tags }}"

  chart:
    name: Helm chart → GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint & template
        run: |
          helm lint chart
          helm template t chart > /dev/null
      - name: Package
        run: helm package chart --destination /tmp/chart
      - name: Push OCI chart (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u ${{ github.actor }} --password-stdin
          helm push /tmp/chart/*.tgz ${{ env.CHART_REPO }}

  build:
    name: Build distribution (on tag)
    runs-on: ubuntu-latest
    needs: [lint-test, security]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
