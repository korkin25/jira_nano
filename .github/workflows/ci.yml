# CI for jira_nano: lint, type-check, test (3.11 & 3.12), and a security scan on
# every push/PR. A version tag additionally builds the distribution (publishing
# to PyPI is a separate, later, explicit step).
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:

jobs:
  lint-test:
    name: Lint & test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check .
      - name: Mypy (type-check)
        run: mypy
      - name: Pytest
        run: pytest -q

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install (runtime deps + scanners)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install bandit pip-audit
      - name: Bandit
        run: bandit -r src
      - name: pip-audit
        run: pip-audit

  build:
    name: Build distribution (on tag)
    runs-on: ubuntu-latest
    needs: [lint-test, security]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/*
