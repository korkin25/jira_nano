# -----------------------------------------------------------------------------
# CI — composed from the public reusable workflows in korkin25/open-ci-actions@v1.
# -----------------------------------------------------------------------------
#
# Every job self-activates from the repository contents — jobs that do not apply
# skip themselves, they do not fail, and they cost nothing. New shared jobs belong
# in open-ci-actions, not here.
#
#   detect      inspects the checkout once and exports boolean-ish flags
#   version     one SemVer (GitVersion) shared by the image and the chart
#   python      ruff + mypy + pytest per interpreter, radon/xenon report
#   sast        gitleaks, semgrep, bandit, pip-audit, checkov, hadolint, trivy-config
#   docker      buildx build -> trivy scan -> push to GHCR on dev/rc/release and tags
#   helm        lint + template always, package + OCI push to GHCR on tags
#   functional  runs the repository's own auto-tests/group-a/validate-*.sh scripts
#   quality     BESPOKE: the JN-47 xenon complexity HARD gate (the shared python
#               job's xenon is only a soft trend signal, so we enforce it here)
#
# PyPI publishing is NOT wired here: it lives in the vendored `publish.yml`
# (manual, workflow_dispatch). The reusable release workflow cannot trusted-publish
# cross-repository (PyPI `job_workflow_ref` limitation), so a vendored workflow is
# the supported pattern — see open-ci-actions release.yml header.
#
# Pinning: @v1 is a moving major tag (fixes and new inputs, no breaking changes).
# -----------------------------------------------------------------------------
name: CI

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ---------------------------------------------------------------------------
  # 1. What kind of repository is this?
  # ---------------------------------------------------------------------------
  detect:
    name: Detect
    runs-on: ubuntu-latest
    outputs:
      has-python: ${{ steps.detect.outputs.has-python }}
      has-dockerfile: ${{ steps.detect.outputs.has-dockerfile }}
      has-chart: ${{ steps.detect.outputs.has-chart }}
      has-tests: ${{ steps.detect.outputs.has-tests }}
      python-package-dir: ${{ steps.detect.outputs.python-package-dir }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        uses: korkin25/open-ci-actions/actions/detect-project@v1
        with:
          dockerfile: Dockerfile
          chart-path: chart
          tests-dir: auto-tests/group-a
          # Only the functional smoke script — complexity-gate.sh is a quality gate,
          # not a functional test, and runs in the bespoke `quality` job below.
          tests-glob: "validate-*.sh"

  # ---------------------------------------------------------------------------
  # 2. One version for everything this pipeline publishes.
  # ---------------------------------------------------------------------------
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.gitversion.outputs.semver }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # required: GitVersion needs the full history
      - id: gitversion
        uses: korkin25/open-ci-actions/actions/gitversion@v1

  # ---------------------------------------------------------------------------
  # 3. Language gates — Python only.
  # ---------------------------------------------------------------------------
  python:
    name: Python
    needs: detect
    if: needs.detect.outputs.has-python == 'true'
    uses: korkin25/open-ci-actions/.github/workflows/python.yml@v1
    with:
      python-versions: '["3.11","3.12"]'
      lint-paths: src
      dev-extra: dev
      pytest-args: -q

  # ---------------------------------------------------------------------------
  # 4. Security scanners — apply to every repository.
  # ---------------------------------------------------------------------------
  sast:
    name: SAST
    needs: detect
    permissions:
      contents: read
      security-events: write
    uses: korkin25/open-ci-actions/.github/workflows/sast.yml@v1
    with:
      has-python: ${{ needs.detect.outputs.has-python }}
      has-dockerfile: ${{ needs.detect.outputs.has-dockerfile }}
      bandit-target: src
      dockerfile: Dockerfile
      semgrep-configs: p/python p/security-audit p/secrets

  # ---------------------------------------------------------------------------
  # 5. Container image.
  # ---------------------------------------------------------------------------
  docker:
    name: Image
    needs: [detect, version]
    if: needs.detect.outputs.has-dockerfile == 'true'
    permissions:
      contents: read
      packages: write
    uses: korkin25/open-ci-actions/.github/workflows/docker.yml@v1
    with:
      dockerfile: Dockerfile
      image-name: jira-nano
      version: ${{ needs.version.outputs.semver }}
      push-branches: dev,rc,release
      platforms: linux/amd64

  # ---------------------------------------------------------------------------
  # 6. Helm chart.
  # ---------------------------------------------------------------------------
  helm:
    name: Chart
    needs: [detect, version]
    if: needs.detect.outputs.has-chart == 'true'
    permissions:
      contents: read
      packages: write
    uses: korkin25/open-ci-actions/.github/workflows/helm.yml@v1
    with:
      chart-path: chart
      version: ${{ needs.version.outputs.semver }}

  # ---------------------------------------------------------------------------
  # 7. Functional tests — the repository's own scripts decide what "works" means.
  # auto-tests/group-a/validate-deploy.sh boots the HTTP API and probes it with a
  # bearer token (self-contained default token — no secret needed).
  # ---------------------------------------------------------------------------
  functional:
    name: Functional
    needs: [detect, docker]
    if: >-
      ${{ !cancelled()
      && needs.detect.outputs.has-tests == 'true'
      && needs.docker.result != 'failure' }}
    uses: korkin25/open-ci-actions/.github/workflows/functional.yml@v1
    with:
      tests-dir: auto-tests/group-a
      tests-glob: "validate-*.sh"
      image-ref: ${{ needs.docker.outputs.image-ref }}

  # ---------------------------------------------------------------------------
  # 8. Bespoke: xenon complexity HARD gate (JN-47).
  # The shared python job runs radon/xenon as a soft trend signal; this job is the
  # merge blocker, with the project's agreed thresholds living in the script
  # (single source of truth, runnable locally).
  # ---------------------------------------------------------------------------
  quality:
    name: Code quality (xenon hard gate)
    needs: detect
    if: needs.detect.outputs.has-python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install radon/xenon
        run: pip install radon xenon
      - name: Complexity report + gate (hard)
        run: bash auto-tests/group-a/complexity-gate.sh
