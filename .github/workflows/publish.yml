# Publish to PyPI — a SEPARATE, EXPLICIT step (never automatic).
# Trigger it by hand: Actions -> "Publish to PyPI" -> Run workflow (on a tag).
# Uses PyPI Trusted Publishing (OIDC) so no API token is stored in the repo.
#
# One-time PyPI setup (see docs/packaging.md):
#   PyPI -> project "jira-nano" -> Publishing -> add a GitHub publisher with
#   owner=korkin25, repo=jira_nano, workflow=publish.yml, environment=pypi.
name: Publish to PyPI

on:
  workflow_dispatch:

jobs:
  publish:
    name: Build & publish
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for Trusted Publishing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
