[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jira-nano"
dynamic = ["version"]
description = "A lightweight, AI-native, git-backed issue tracker."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
authors = [{ name = "Evgenii Kuzakov" }]
keywords = ["issue-tracker", "jira", "mcp", "git", "telegram"]
dependencies = [
    "pygit2>=1.14",   # JN-2 / JN-29: git store + change detection
    "pydantic>=2.6",  # JN-1: domain models + validation
    "pyyaml>=6.0",    # JN-1 / JN-28: frontmatter + config
]

[project.scripts]
jira-nano = "jira_nano.cli:main"
jira-nano-mcp = "jira_nano.mcp_server:run"
jira-nano-mcp-http = "jira_nano.mcp_server:run_http"
jira-nano-http = "jira_nano.http.app:run"
jira-nano-bot = "jira_nano.telegram.bot:run"
jira-nano-webhooks = "jira_nano.githost.webhook:run"
jira-nano-voice-setup = "jira_nano.telegram.transcribe:preload"

[project.optional-dependencies]
mcp = ["mcp>=1.2"]                       # JN-11: MCP server (FastMCP)
http = ["fastapi>=0.110", "uvicorn>=0.20"]  # JN-13: HTTP API (Jira REST)
telegram = ["aiogram>=3.0"]              # JN-14: Telegram bot mirror
voice = ["faster-whisper>=1.0"]         # JN-43: local Whisper STT (heavy; on-demand)
dev = [
    "mcp>=1.2",
    "fastapi>=0.110",
    "uvicorn>=0.20",
    "httpx>=0.27",
    "aiogram>=3.0",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
    "types-pyyaml",
]

[tool.hatch.version]
path = "src/jira_nano/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jira_nano"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom uses callables as argument defaults.
extend-immutable-calls = ["fastapi.Body", "fastapi.Header", "fastapi.Query", "fastapi.Path", "fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "live: end-to-end test against real external accounts (Telegram); opt-in via JIRA_NANO_LIVE=1",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests"]

# JN-43: optional, un-stubbed STT libraries; imported lazily inside transcribe().
[[tool.mypy.overrides]]
module = ["faster_whisper", "faster_whisper.*", "openai", "openai.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["jira_nano"]

[tool.bandit]
# Documented false positives in this codebase:
#   B105 — hits env-var *names* (e.g. TELEGRAM_BOT_TOKEN) and the OAuth "Bearer"
#          token_type literal; real secrets always come from the environment.
#   B608 — hits SQL built from a fixed column allow-list plus '?' placeholders
#          (fully parameterized; no user input is interpolated into the query).
#   B104 — the HTTP API / webhook receiver are network services that bind all
#          interfaces by design; operators restrict exposure via env var / firewall.
skips = ["B104", "B105", "B608"]
